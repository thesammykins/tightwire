# cargo-about configuration for THIRD-PARTY-NOTICES.txt (scripts/notices.sh).
# Only licences known to be compatible with GPL-3.0-or-later are accepted, so
# a new dependency under anything else fails the notices build instead of
# slipping into a release.
# Order matters: for "A OR B" crates the first accepted licence is the one
# reproduced, so the shortest permissive texts come first.
accepted = [
  "MIT",
  "ISC",
  "Zlib",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
]
# tightwire-recv itself (publish = false) is covered by LICENSE.
private = { ignore = true }
# The shipped binary is the Windows receiver.
targets = ["x86_64-pc-windows-msvc", "x86_64-pc-windows-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
