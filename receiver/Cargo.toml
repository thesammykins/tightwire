[package]
name = "tightwire-recv"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Tightwire low-latency PCM-over-UDP receiver"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
cpal = "0.18"
rtrb = "0.4"
hound = "3.5"
x25519-dalek = { version = "3.0", features = ["getrandom"] }
sha2 = "0.11"
hkdf = "0.13"
hmac = "0.13"
getrandom = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Console",
  "Win32_Security_Cryptography",
] }

[dev-dependencies]
serde_json = "1"
siphasher = "1"

[profile.release]
debug = 1

# Shipped binaries: no debug info, stripped.
[profile.dist]
inherits = "release"
debug = 0
strip = true
